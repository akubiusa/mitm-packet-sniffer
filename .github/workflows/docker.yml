name: Docker

on:
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record checked out revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for containers to stabilize
        run: sleep 60

      - name: Check mitmproxy container state
        run: |
          container_id=$(docker compose ps -q mitmproxy)
          if [ -z "$container_id" ]; then
            echo "::error::mitmproxy container was not created (docker compose ps -q returned empty)"
            docker compose ps
            exit 1
          fi
          state=$(docker inspect --format='{{json .State}}' "$container_id")
          echo "State: $state"
          running=$(echo "$state" | jq -r '.Running')
          restart_count=$(docker inspect --format='{{.RestartCount}}' "$container_id")
          echo "RestartCount: $restart_count"
          if [ "$running" != "true" ]; then
            echo "::error::mitmproxy container is not running"
            exit 1
          fi
          if [ "$restart_count" -gt 0 ]; then
            echo "::error::mitmproxy container has restarted $restart_count time(s), indicating a crash loop"
            exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker compose logs mitmproxy

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  docker-ci:
    name: Docker CI
    needs: smoke-test
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: write
      packages: write
      deployments: write
    uses: book000/templates/.github/workflows/reusable-docker.yml@master
    with:
      targets: >-
        [
          { imageName: "book000/mitm-packet-sniffer", context: "mitmproxy-addon", file: "mitmproxy-addon/Dockerfile", packageName: "mitm-packet-sniffer" }
        ]
      platforms: linux/amd64,linux/arm64
      is-merged: true
      pr-head-sha: ${{ needs.smoke-test.outputs.revision }}
    secrets:
      DOCKER_USERNAME: ${{ github.actor }}
      DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
