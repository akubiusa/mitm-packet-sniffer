# Builds the Docker image via the reusable workflow from book000/templates and smoke-tests the compose stack.
# Runs when a pull request is opened or updated.

name: Docker

on:
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - synchronize
    paths:
      - .github/workflows/docker.yml
  pull_request_target:
    branches:
      - main
      - master
    types:
      - opened
      - synchronize
      - reopened
      - closed

concurrency:
  # Include event_name so that pull_request and pull_request_target runs do not cancel each other
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  post-approval-request:
    name: Post approval request
    runs-on: ubuntu-latest
    # Post the approval request only for fork PRs (not needed on closed)
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && github.event.action != 'closed'
    continue-on-error: true
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Find existing approval request comment
        id: find-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: Waiting for Environment approval

      - name: Post or update approval request comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## Waiting for Environment approval

            Approval of the `fork-pr-build` Environment is required to run the build for this PR.

            [Review the Actions run and approve it](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}?pr=${{ github.event.pull_request.number }})

  approval-gate:
    name: Approval gate
    runs-on: ubuntu-latest
    needs: post-approval-request
    # Always run, regardless of the post-approval-request result
    if: always()
    # Manual approval through the Environment is required only for fork PRs that are not closed
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && github.event.action != 'closed' && 'fork-pr-build' || '' }}
    permissions: {}
    steps:
      - name: Approval granted
        run: echo "Approval gate passed"

  docker-ci:
    name: Docker CI
    needs: approval-gate
    if: always() && needs.approval-gate.result == 'success' && (github.event.action != 'closed' || github.event.pull_request.merged == true)
    uses: book000/templates/.github/workflows/reusable-docker.yml@master
    with:
      targets: >-
        [
          { imageName: "book000/mitm-packet-sniffer", context: "mitmproxy-addon", file: "mitmproxy-addon/Dockerfile", packageName: "mitm-packet-sniffer" }
        ]
      platforms: linux/amd64,linux/arm64
      # For fork PRs under pull_request_target, actions/checkout by default refuses to check out
      # the head SHA for security reasons. Fork PRs already require manual approval of the
      # fork-pr-build Environment in approval-gate above, so checkout is allowed only once approved.
      allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository }}
    secrets:
      DOCKER_USERNAME: ${{ github.actor }}
      DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    name: Smoke test
    needs: approval-gate
    if: always() && needs.approval-gate.result == 'success' && (github.event.action != 'closed' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for containers to stabilize
        run: sleep 60

      - name: Check mitmproxy container state
        run: |
          container_id=$(docker compose ps -q mitmproxy)
          if [ -z "$container_id" ]; then
            echo "::error::mitmproxy container was not created (docker compose ps -q returned empty)"
            docker compose ps
            exit 1
          fi
          state=$(docker inspect --format='{{json .State}}' "$container_id")
          echo "State: $state"
          running=$(echo "$state" | jq -r '.Running')
          restart_count=$(docker inspect --format='{{.RestartCount}}' "$container_id")
          echo "RestartCount: $restart_count"
          if [ "$running" != "true" ]; then
            echo "::error::mitmproxy container is not running"
            exit 1
          fi
          if [ "$restart_count" -gt 0 ]; then
            echo "::error::mitmproxy container has restarted $restart_count time(s), indicating a crash loop"
            exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker compose logs mitmproxy

      - name: Tear down stack
        if: always()
        run: docker compose down -v
